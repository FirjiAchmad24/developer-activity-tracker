name: Developer Activity Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "47 22 * * *"
      timezone: "Asia/Makassar"

    - cron: "17 23 * * *"
      timezone: "Asia/Makassar"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check today's GitHub contributions
        id: activity
        env:
          GITHUB_USERNAME: FirjiAchmad24
          GH_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
        run: python scripts/check_github_activity.py

      - name: Contribution status
        run: |
          echo "Contribution date: ${{ steps.activity.outputs.activity_date }}"
          echo "Contribution count: ${{ steps.activity.outputs.contribution_count }}"
          echo "Has activity: ${{ steps.activity.outputs.has_activity }}"

      - name: Generate fallback developer activity
        if: steps.activity.outputs.has_activity == 'false'
        run: python scripts/update_activity.py

      - name: Skip fallback activity
        if: steps.activity.outputs.has_activity == 'true'
        run: |
          echo "GitHub contribution already exists today."
          echo "No fallback activity is required."

      - name: Show generated changes
        run: git diff

      - name: Configure Git author
        run: |
          git config user.name "FirjiAchmad24"
          git config user.email "144012968+FirjiAchmad24@users.noreply.github.com"

      - name: Commit generated activity
        run: |
          git add activity/ data/activity.json

          if git diff --cached --quiet; then
            echo "No activity changes to commit."
          else
            git commit -m "chore(activity): record automated developer activity"
            git push
          fi
