name: Developer Activity Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate developer activity
        run: python scripts/update_activity.py

      - name: Show generated changes
        run: git diff

      - name: Configure Git author
        run: |
          git config user.name "FirjiAchmad24"
          git config user.email "144012968+FirjiAchmad24@users.noreply.github.com"

      - name: Commit generated activity
        run: |
          git add activity/ data/activity.json

          if git diff --cached --quiet; then
            echo "No activity changes to commit."
          else
            git commit -m "chore(activity): record automated developer activity"
            git push
          fi
